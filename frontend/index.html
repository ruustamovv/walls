<!doctype html>
<html lang="en" data-theme="site">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Quoridor — wall-and-pawn strategy arena on quoridor.uz. Build walls. Find path." />
    <meta name="theme-color" content="#faf8f2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2313122e'/%3E%3Ccircle cx='11' cy='11' r='4' fill='%2322d3ee'/%3E%3Ccircle cx='21' cy='21' r='4' fill='%23f59e0b'/%3E%3Crect x='14' y='5' width='12' height='3.6' rx='1.8' fill='%23faf8f2'/%3E%3Crect x='5' y='14' width='3.6' height='12' rx='1.8' fill='%23faf8f2'/%3E%3C/svg%3E" />
    <title>Quoridor — Build walls. Find path.</title>
  </head>
  <body>
    <script>
      // Pre-paint theme: applied before React boots to avoid a theme flash.
      try {
        var raw = localStorage.getItem('quoridor-settings');
        var old = localStorage.getItem('nexus-settings');
        var parsed = raw ? JSON.parse(raw).state : (old ? JSON.parse(old).state : null);
        var choice = parsed ? parsed.theme : 'auto';
        var path = window.location.pathname;
        var arena = /^\/(game|replay|play\/(local|bot|multi))/.test(path);
        document.documentElement.dataset.theme = choice === 'auto' ? (arena ? 'arena' : 'site') : choice;
        var board = parsed ? parsed.boardTheme : null;
        if (board) document.documentElement.dataset.board = board;
      } catch (e) { /* default theme stands */ }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
